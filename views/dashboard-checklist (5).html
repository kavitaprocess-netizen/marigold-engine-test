<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marigold — Checklist</title>
<link rel="stylesheet" href="/brand.css">
<style>
html,body{min-height:100vh;background:var(--cream);}
#header{min-height:52px;width:100%;box-sizing:border-box;border-bottom:1px solid #E8DFC8;padding:16px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:#FDF9EE;z-index:100}
#header .brand{display:flex;align-items:center;gap:8px;text-decoration:none;color:#2E2418;font-style:italic;font-size:16px}
.breadcrumb-back{display:inline-block;font-size:12px;color:var(--muted);font-style:italic;text-decoration:none;transition:color 0.15s;position:sticky;background:var(--cream);padding:6px 0;z-index:95}
.breadcrumb-back:hover{color:var(--deep)}
.wrap{max-width:640px;margin:0 auto;padding:32px 24px 80px}
.center-wrap{max-width:400px;margin:80px auto;padding:0 24px;text-align:center}
.dash-input{width:100%;padding:10px 12px;border:1px solid var(--bdr);border-radius:8px;font-family:'Playfair Display',Georgia,serif;font-style:italic;font-size:14px;color:var(--tx);background:#FDFAF0;margin-bottom:16px;box-sizing:border-box}
.dash-input:focus{outline:none;border-color:var(--gd)}
.dash-err{color:#B23;font-size:12px;font-style:italic;margin:-10px 0 16px;display:none}
.dash-title{font-size:26px;font-style:italic;color:var(--deep);margin-bottom:8px}
.dash-sub{font-size:13px;color:var(--muted);font-style:italic;line-height:1.6;margin-bottom:28px}
.loading-state{text-align:center;padding:80px 24px;color:var(--muted);font-style:italic}

/* Hero */
.hero{margin-bottom:32px}
.hero-eyebrow{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);font-style:italic;margin-bottom:6px}
.hero-title{font-size:28px;font-style:italic;color:var(--deep);margin-bottom:4px}
.hero-sub{font-size:13px;color:var(--muted);font-style:italic;margin-bottom:20px}
.hero-progress-track{height:8px;background:var(--warm);border-radius:20px;overflow:hidden;margin-bottom:8px}
.hero-progress-fill{height:100%;background:var(--gd);border-radius:20px;transition:width 0.4s ease}
.hero-progress-label{font-size:12px;color:var(--muted);font-style:italic;display:flex;justify-content:space-between}
.sticky-progress{position:sticky;background:var(--cream);padding:12px 0 20px;z-index:90}

/* Up next */
.upnext{border:1.5px solid var(--gd);border-radius:14px;padding:22px;margin-bottom:28px;background:#FFFAEA}
.upnext-eyebrow{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--gk);font-style:italic;margin-bottom:4px}
.upnext-title{font-size:18px;font-style:italic;color:var(--deep);margin-bottom:14px}
.upnext-all-done{font-size:14px;color:var(--muted);font-style:italic;text-align:center;padding:8px 0}

/* Milestone sections */
.milestone-section{border:1px solid var(--bdr);border-radius:12px;margin-bottom:12px;overflow:hidden;background:white}
.milestone-header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;cursor:pointer;user-select:none}
.milestone-header:hover{background:var(--warm)}
.milestone-header-left{display:flex;align-items:center;gap:10px}
.milestone-chevron{font-size:11px;color:var(--muted);transition:transform 0.2s}
.milestone-chevron.open{transform:rotate(90deg)}
.milestone-name{font-size:14px;font-style:italic;color:var(--deep)}
.milestone-date{font-size:11px;color:var(--muted);font-style:italic}
.milestone-mini-progress{font-size:11px;color:var(--muted);font-style:italic}
.milestone-body{padding:0 18px 14px;display:none}
.milestone-body.open{display:block}

.faith-heading{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--deep);font-style:italic;margin:16px 0 4px;padding-top:10px;border-top:1px solid var(--bdr)}
.faith-heading:first-child{margin-top:4px;padding-top:0;border-top:none}
.side-heading{display:flex;align-items:center;gap:6px;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);font-style:italic;margin:10px 0 6px}
.side-heading:first-child{margin-top:6px}
.side-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.checklist-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--warm)}
.checklist-row:last-child{border-bottom:none}
.checklist-checkbox{width:17px;height:17px;flex-shrink:0;cursor:pointer}
.checklist-label{font-size:14px;color:var(--tx);flex:1;transition:color 0.2s}
.checklist-label.done{color:var(--muted);text-decoration:line-through}

#checklist-save-indicator{font-size:11px;color:var(--muted);font-style:italic}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>
<body>

<div id="header">
  <a class="brand" href="/">
    <svg width="20" height="20" viewBox="0 0 34 34" xmlns="http://www.w3.org/2000/svg">
      <g fill="#E0B030" stroke="#C8941A" stroke-width="0.4"><ellipse cx="17" cy="5.8" rx="1.9" ry="4.4" transform="rotate(0 17 17)"/><ellipse cx="17" cy="5.8" rx="1.9" ry="4.4" transform="rotate(25.7 17 17)"/><ellipse cx="17" cy="5.8" rx="1.9" ry="4.4" transform="rotate(51.4 17 17)"/><ellipse cx="17" cy="5.8" rx="1.9" ry="4.4" transform="rotate(77.1 17 17)"/><ellipse cx="17" cy="5.8" rx="1.9" ry="4.4" transform="rotate(102.8 17 17)"/><ellipse cx="17" cy="5.8" rx="1.9" ry="4.4" transform="rotate(128.5 17 17)"/><ellipse cx="17" cy="5.8" rx="1.9" ry="4.4" transform="rotate(154.2 17 17)"/><ellipse cx="17" cy="5.8" rx="1.9" ry="4.4" transform="rotate(180 17 17)"/><ellipse cx="17" cy="5.8" rx="1.9" ry="4.4" transform="rotate(205.7 17 17)"/><ellipse cx="17" cy="5.8" rx="1.9" ry="4.4" transform="rotate(231.4 17 17)"/><ellipse cx="17" cy="5.8" rx="1.9" ry="4.4" transform="rotate(257.1 17 17)"/><ellipse cx="17" cy="5.8" rx="1.9" ry="4.4" transform="rotate(282.8 17 17)"/><ellipse cx="17" cy="5.8" rx="1.9" ry="4.4" transform="rotate(308.5 17 17)"/><ellipse cx="17" cy="5.8" rx="1.9" ry="4.4" transform="rotate(334.2 17 17)"/></g>
      <g fill="#F7D44C" stroke="#E0B030" stroke-width="0.3"><ellipse cx="17" cy="10.2" rx="1.3" ry="2.4" transform="rotate(0 17 17)"/><ellipse cx="17" cy="10.2" rx="1.3" ry="2.4" transform="rotate(20 17 17)"/><ellipse cx="17" cy="10.2" rx="1.3" ry="2.4" transform="rotate(60 17 17)"/><ellipse cx="17" cy="10.2" rx="1.3" ry="2.4" transform="rotate(120 17 17)"/><ellipse cx="17" cy="10.2" rx="1.3" ry="2.4" transform="rotate(180 17 17)"/><ellipse cx="17" cy="10.2" rx="1.3" ry="2.4" transform="rotate(240 17 17)"/><ellipse cx="17" cy="10.2" rx="1.3" ry="2.4" transform="rotate(300 17 17)"/></g>
      <circle cx="17" cy="17" r="4.1" fill="#6B5318" stroke="#5A4512" stroke-width="0.3"/>
    </svg>
    marigold
  </a>
</div>

<div id="app-root">
  <div class="loading-state">Loading&hellip;</div>
</div>

<script>
var supabaseClient = window.supabase.createClient(
  'https://palatnljuhrmidpokjtq.supabase.co',
  'sb_publishable_q-3NcTJcFBYo8bmEggiEkA_q5dPwnKR'
);
var COLORS = { side1: '#C8A820', side2: '#9A7E10', both: '#C17040' };

var root = document.getElementById('app-root');
var currentPlanId = null;
var currentPlanData = null;
var openMilestones = {};

function renderSignIn() {
  root.innerHTML =
    '<div class="center-wrap">' +
      '<div class="dash-title">Sign in</div>' +
      '<div class="dash-sub">Enter the email you used to save your plan.</div>' +
      '<input type="email" id="dash-email-input" class="dash-input" placeholder="you@example.com" autocomplete="email">' +
      '<div id="dash-email-err" class="dash-err"></div>' +
      '<button class="cta" id="dash-send-btn">Send link</button>' +
    '</div>';

  document.getElementById('dash-send-btn').onclick = async function() {
    var btn = this;
    var input = document.getElementById('dash-email-input');
    var err = document.getElementById('dash-email-err');
    var email = (input.value || '').trim();
    if (!email || email.indexOf('@') === -1 || email.indexOf('.') === -1) {
      err.textContent = 'Please enter a valid email.';
      err.style.display = 'block';
      return;
    }
    err.style.display = 'none';
    btn.textContent = 'Sending...'; btn.disabled = true;
    try {
      var redirectTo = window.location.origin + window.location.pathname;
      var result = await supabaseClient.auth.signInWithOtp({ email: email, options: { emailRedirectTo: redirectTo } });
      if (result.error) {
        err.textContent = 'We couldn\'t send that link. Please double-check your email and try again.';
        err.style.display = 'block';
        btn.textContent = 'Send link'; btn.disabled = false;
        return;
      }
      root.innerHTML = '<div class="center-wrap"><div class="dash-title">Check your email</div><div class="dash-sub">We sent a link to ' + email + ' — click it to open your checklist.</div></div>';
    } catch (e) {
      err.textContent = 'Something went wrong. Please try again.';
      err.style.display = 'block';
      btn.textContent = 'Send link'; btn.disabled = false;
    }
  };
  setTimeout(function(){ var el = document.getElementById('dash-email-input'); if (el) el.focus(); }, 50);
}

function itemFaith(item) {
  return item._sourceTraditionSlug || item.tradition || item.source || item._sourceTradition || '';
}

function checklistItemId(item, i, suffix) {
  var label = item.label || item.task || item.description || ('item' + i);
  var slug = label.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
  return 'ci-' + i + '-' + slug.slice(0, 40) + (suffix || '');
}

// Parses a milestone label into an approximate number of months before the
// wedding -- used both to order milestones chronologically and, if a
// wedding date is known, to show a real approximate calendar date.
function parseMilestoneMonths(label) {
  var l = (label || '').toLowerCase();
  if (l.indexOf('after') !== -1) return -1;
  var numMatch = l.match(/(\d+)/);
  var num = numMatch ? parseInt(numMatch[1], 10) : null;
  if (l.indexOf('week') !== -1) return num ? num * 0.23 : 0.25;
  if (l.indexOf('day') !== -1) return num ? num * 0.033 : 0.03;
  return num !== null ? num : 99;
}

function approxDateForMilestone(weddingDateIso, months) {
  if (!weddingDateIso) return null;
  try {
    var d = new Date(weddingDateIso);
    d.setDate(d.getDate() - Math.round(months * 30.4));
    return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
  } catch (e) { return null; }
}

// Expands the raw items array into the actual set of independently
// checkable instances -- a 'bride+groom' item becomes TWO instances (one
// per partner, each with its own suffixed id), everything else stays one.
// Each instance also gets its faith and side bucket computed once here, so
// counting and rendering can never disagree with each other.
function expandChecklistInstances(items, S) {
  var t1 = S.traditions ? S.traditions[0] : null;
  var t2 = S.traditions ? S.traditions[1] : null;
  var hasTwoTraditions = !!(t1 && t2);
  var out = [];
  items.forEach(function(item, i) {
    var side = item.side || 'both';
    var faith = itemFaith(item);
    var faithBucket = !hasTwoTraditions ? 'single' : (faith === t1 ? 'faith1' : (faith === t2 ? 'faith2' : 'sharedFaith'));
    if (side === 'bride+groom') {
      out.push({ item: item, index: i, id: checklistItemId(item, i, '-s1'), sideBucket: 'side1', faithBucket: faithBucket });
      out.push({ item: item, index: i, id: checklistItemId(item, i, '-s2'), sideBucket: 'side2', faithBucket: faithBucket });
    } else if (side === 'bride') {
      out.push({ item: item, index: i, id: checklistItemId(item, i), sideBucket: 'side1', faithBucket: faithBucket });
    } else if (side === 'groom') {
      out.push({ item: item, index: i, id: checklistItemId(item, i), sideBucket: 'side2', faithBucket: faithBucket });
    } else {
      out.push({ item: item, index: i, id: checklistItemId(item, i), sideBucket: 'shared', faithBucket: faithBucket });
    }
  });
  return out;
}

function checklistRowHtml(inst, progress) {
  var label = inst.item.label || inst.item.task || inst.item.description || '';
  var checked = !!progress[inst.id];
  return '<div class="checklist-row" data-id="' + inst.id + '">' +
    '<input type="checkbox" class="checklist-checkbox" ' + (checked ? 'checked' : '') + ' data-id="' + inst.id + '">' +
    '<span class="checklist-label' + (checked ? ' done' : '') + '">' + label + '</span>' +
  '</div>';
}

function sideHeadingHtml(text, color) {
  return '<div class="side-heading"><span class="side-dot" style="background:' + color + '"></span>' + text + '</div>';
}

// Renders a set of same-milestone instances, grouped by faith first (only
// when the wedding has two traditions), then by side within each faith.
function groupedRowsHtml(instances, S) {
  var hasTwoTraditions = S.traditions && S.traditions.length > 1;

  function sideGroupsHtml(subset) {
    var side1 = subset.filter(function(inst) { return inst.sideBucket === 'side1'; });
    var side2 = subset.filter(function(inst) { return inst.sideBucket === 'side2'; });
    var shared = subset.filter(function(inst) { return inst.sideBucket === 'shared'; });
    var html = '';
    if (side1.length) {
      html += sideHeadingHtml(S.name1 || 'Partner 1', COLORS.side1) +
        side1.map(function(inst) { return checklistRowHtml(inst, progressRef); }).join('');
    }
    if (side2.length) {
      html += sideHeadingHtml(S.name2 || 'Partner 2', COLORS.side2) +
        side2.map(function(inst) { return checklistRowHtml(inst, progressRef); }).join('');
    }
    if (shared.length) {
      html += sideHeadingHtml('Shared', COLORS.both) +
        shared.map(function(inst) { return checklistRowHtml(inst, progressRef); }).join('');
    }
    return html;
  }

  if (!hasTwoTraditions) {
    return sideGroupsHtml(instances);
  }

  var t1 = S.traditions[0], t2 = S.traditions[1];
  function titleCase(slug) {
    return (slug || '').replace(/-/g, ' ').replace(/\b\w/g, function(c) { return c.toUpperCase(); });
  }
  var t1Label = titleCase(t1);
  var t2Label = titleCase(t2);
  var faith1 = instances.filter(function(inst) { return inst.faithBucket === 'faith1'; });
  var faith2 = instances.filter(function(inst) { return inst.faithBucket === 'faith2'; });
  var sharedFaith = instances.filter(function(inst) { return inst.faithBucket === 'sharedFaith'; });

  var html = '';
  if (faith1.length) html += '<div class="faith-heading">' + t1Label + '</div>' + sideGroupsHtml(faith1);
  if (faith2.length) html += '<div class="faith-heading">' + t2Label + '</div>' + sideGroupsHtml(faith2);
  if (sharedFaith.length) html += '<div class="faith-heading">Shared across both</div>' + sideGroupsHtml(sharedFaith);
  return html;
}

// checklistRowHtml needs access to the current progress object; keeping a
// module-level reference set at render time avoids threading it through
// every helper function individually.
var progressRef = {};

function renderChecklistPage(items, progress, S) {
  progressRef = progress;
  var instances = expandChecklistInstances(items, S);
  var doneCount = instances.filter(function(inst) { return !!progress[inst.id]; }).length;
  var totalCount = instances.length;
  var pct = totalCount ? Math.round((doneCount / totalCount) * 100) : 0;

  var groups = {};
  var order = [];
  instances.forEach(function(inst) {
    var m = inst.item.milestone || inst.item.timeframe || 'General';
    if (!groups[m]) { groups[m] = { instances: [], months: parseMilestoneMonths(m) }; order.push(m); }
    groups[m].instances.push(inst);
  });
  order.sort(function(a, b) { return groups[b].months - groups[a].months; });

  var upNextMilestone = null;
  for (var oi = 0; oi < order.length; oi++) {
    var g = groups[order[oi]];
    var hasUnchecked = g.instances.some(function(inst) { return !progress[inst.id]; });
    if (hasUnchecked) { upNextMilestone = order[oi]; break; }
  }

  var weddingDate = S.date || null;

  var breadcrumbHtml = '<a class="breadcrumb-back" id="breadcrumb-back" href="/dashboard">&larr; Dashboard</a>';

  var heroHtml =
    '<div class="hero">' +
      '<div class="hero-eyebrow">' + (S.name1 || 'Your') + ' &amp; ' + (S.name2 || 'wedding') + '</div>' +
      '<div class="hero-title">Checklist</div>' +
      '<div class="hero-sub">' + (weddingDate ? new Date(weddingDate).toLocaleDateString('en-US', {month:'long', day:'numeric', year:'numeric'}) : 'Date to be confirmed') + '</div>' +
    '</div>';

  var progressBarHtml =
    '<div id="sticky-progress" class="sticky-progress">' +
      '<div class="hero-progress-track"><div class="hero-progress-fill" style="width:' + pct + '%"></div></div>' +
      '<div class="hero-progress-label"><span>' + doneCount + ' of ' + totalCount + ' tasks done</span><span>' + pct + '%</span></div>' +
    '</div>';

  var upNextHtml = '';
  if (upNextMilestone) {
    var upInstances = groups[upNextMilestone].instances.filter(function(inst) { return !progress[inst.id]; });
    upNextHtml =
      '<div class="upnext">' +
        '<div class="upnext-eyebrow">Up next &middot; ' + upNextMilestone + '</div>' +
        '<div class="upnext-title">What needs your attention now</div>' +
        '<div id="upnext-body">' + groupedRowsHtml(upInstances, S) + '</div>' +
      '</div>';
  } else if (totalCount > 0) {
    upNextHtml = '<div class="upnext"><div class="upnext-all-done">Everything is checked off. Well done!</div></div>';
  }

  var sectionsHtml = order.map(function(m) {
    var g = groups[m];
    var isOpen = !!openMilestones[m];
    var dateLabel = approxDateForMilestone(weddingDate, g.months);
    var doneInGroup = g.instances.filter(function(inst) { return !!progress[inst.id]; }).length;
    return '<div class="milestone-section" data-milestone="' + m + '">' +
      '<div class="milestone-header" data-toggle="' + m + '">' +
        '<div class="milestone-header-left">' +
          '<span class="milestone-chevron' + (isOpen ? ' open' : '') + '">&rsaquo;</span>' +
          '<span class="milestone-name">' + m + '</span>' +
          (dateLabel ? '<span class="milestone-date">&middot; ' + dateLabel + '</span>' : '') +
        '</div>' +
        '<span class="milestone-mini-progress">' + doneInGroup + ' / ' + g.instances.length + '</span>' +
      '</div>' +
      '<div class="milestone-body' + (isOpen ? ' open' : '') + '" id="mbody-' + m.replace(/[^a-z0-9]+/gi,'-') + '">' +
        groupedRowsHtml(g.instances, S) +
      '</div>' +
    '</div>';
  }).join('');

  root.innerHTML = '<div class="wrap">' + breadcrumbHtml + heroHtml + progressBarHtml + upNextHtml + sectionsHtml + '</div>';

  document.querySelectorAll('[data-toggle]').forEach(function(header) {
    header.onclick = function() {
      var m = header.getAttribute('data-toggle');
      openMilestones[m] = !openMilestones[m];
      var section = header.closest('.milestone-section');
      section.querySelector('.milestone-chevron').classList.toggle('open', openMilestones[m]);
      section.querySelector('.milestone-body').classList.toggle('open', openMilestones[m]);
    };
  });

  attachChecklistHandlers();

  // Position the sticky breadcrumb and progress bar sequentially below the
  // nav header, measured dynamically rather than assumed, since header
  // height (and now breadcrumb height) can vary.
  requestAnimationFrame(function() {
    var headerEl = document.getElementById('header');
    var breadcrumbEl = document.getElementById('breadcrumb-back');
    var progressEl = document.getElementById('sticky-progress');
    var offset = headerEl ? headerEl.offsetHeight : 0;
    if (breadcrumbEl) {
      breadcrumbEl.style.top = offset + 'px';
      offset += breadcrumbEl.offsetHeight;
    }
    if (progressEl) {
      progressEl.style.top = offset + 'px';
    }
  });
}

var checklistSaveTimer = null;
function scheduleChecklistSave() {
  if (checklistSaveTimer) clearTimeout(checklistSaveTimer);
  checklistSaveTimer = setTimeout(async function() {
    try {
      await supabaseClient.from('plans').update({ plan_data: currentPlanData }).eq('id', currentPlanId);
    } catch (e) {
      console.error('Checklist save failed:', e);
    }
  }, 700);
}

function attachChecklistHandlers() {
  if (!currentPlanData.checklistProgress) currentPlanData.checklistProgress = {};
  document.querySelectorAll('.checklist-checkbox').forEach(function(cb) {
    cb.onchange = function() {
      var id = cb.getAttribute('data-id');
      currentPlanData.checklistProgress[id] = cb.checked;
      var S = currentPlanData.S || {};
      var items = (S.plan && S.plan.checklist) || [];
      renderChecklistPage(items, currentPlanData.checklistProgress, S);
      scheduleChecklistSave();
    };
  });
}

async function loadChecklist() {
  var sessionResult = await supabaseClient.auth.getSession();
  var session = sessionResult.data.session;
  if (!session) {
    renderSignIn();
    return;
  }
  var result = await supabaseClient.from('plans').select('*').eq('user_id', session.user.id).maybeSingle();
  if (result.error) {
    root.innerHTML = '<div class="center-wrap"><div class="dash-title">Something went wrong</div><div class="dash-sub">We couldn\u2019t load your checklist. Please try refreshing the page.</div></div>';
    return;
  }
  if (!result.data) {
    root.innerHTML = '<div class="center-wrap"><div class="dash-title">No saved plan yet</div><div class="dash-sub">Once you save a plan from the questionnaire, your checklist will show up here.</div><a href="/questionnaire" class="cta" style="display:inline-block;text-decoration:none;margin-top:8px">Start your plan &rarr;</a></div>';
    return;
  }
  currentPlanId = result.data.id;
  currentPlanData = result.data.plan_data || {};
  var S = currentPlanData.S || {};
  var items = (S.plan && S.plan.checklist) || [];
  var progress = currentPlanData.checklistProgress || {};
  renderChecklistPage(items, progress, S);
}

supabaseClient.auth.onAuthStateChange(function(event, session) {
  if (event === 'SIGNED_IN') { loadChecklist(); }
});

window.onload = loadChecklist;
</script>

</body>
</html>
