<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marigold — Budget</title>
<link rel="stylesheet" href="/brand.css">
<style>
html,body{min-height:100vh;background:var(--cream);}
#header{min-height:52px;width:100%;box-sizing:border-box;border-bottom:1px solid #E8DFC8;padding:16px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:#FDF9EE;z-index:100}
#header .brand{display:flex;align-items:center;gap:8px;text-decoration:none;color:#2E2418;font-style:italic;font-size:16px}
.breadcrumb-back{display:block;width:100%;box-sizing:border-box;font-size:12px;color:var(--muted);font-style:italic;text-decoration:none;transition:color 0.15s;position:sticky;background:var(--cream);padding:6px 0;z-index:95}
.breadcrumb-back:hover{color:var(--deep)}
.wrap{max-width:640px;margin:0 auto;padding:32px 24px 80px}
.center-wrap{max-width:400px;margin:80px auto;padding:0 24px;text-align:center}
.dash-title{font-size:26px;font-style:italic;color:var(--deep);margin-bottom:8px}
.dash-sub{font-size:13px;color:var(--muted);font-style:italic;line-height:1.6;margin-bottom:28px}
.loading-state{text-align:center;padding:80px 24px;color:var(--muted);font-style:italic}

/* Summary card -- always visible, persistent, never hidden */
.budget-summary{border:1.5px solid var(--gd);border-radius:14px;padding:22px;margin-bottom:28px;background:#FFFAEA;position:sticky;top:68px;z-index:80}
.budget-summary-total{font-size:24px;font-style:italic;color:var(--deep);margin-bottom:10px}
.budget-summary-row{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);font-style:italic;padding:3px 0}
.budget-summary-row.remainder-ok{color:var(--gk)}
.budget-summary-row.remainder-over{color:#B23;font-weight:600}
.budget-summary-row.remainder-under{color:var(--muted)}

/* Category rows */
.budget-cat{border:1px solid var(--bdr);border-radius:12px;margin-bottom:12px;padding:16px 18px;background:white}
.budget-cat-header{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.budget-cat-name{font-size:15px;font-style:italic;color:var(--deep)}
.budget-cat-pct{font-size:12px;color:var(--muted);font-style:italic}
.budget-cat-badge{display:inline-block;font-size:10px;text-transform:uppercase;letter-spacing:0.5px;color:var(--gk);background:var(--warm);border-radius:10px;padding:2px 8px;margin-left:8px;font-style:normal}
.budget-cat-fields{display:flex;gap:12px;flex-wrap:wrap}
.budget-field{flex:1;min-width:140px}
.budget-field label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:0.5px;color:var(--muted);margin-bottom:4px}
.budget-field-input-wrap{position:relative}
.budget-field-input-wrap:before{content:'$';position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:14px}
.budget-field input{width:100%;padding:8px 10px 8px 22px;border:1px solid var(--bdr);border-radius:8px;font-family:'Playfair Display',Georgia,serif;font-size:14px;color:var(--tx);background:#FDFAF0;box-sizing:border-box}
.budget-field input:focus{outline:none;border-color:var(--gd)}
.budget-cat-range{font-size:11px;color:var(--muted);font-style:italic;margin-top:4px}
.budget-cat-variance{font-size:12px;font-style:italic;margin-top:8px;padding-top:8px;border-top:1px solid var(--bdr)}
.budget-cat-variance.over{color:#B23}
.budget-cat-variance.under{color:var(--gk)}
</style>
</head>
<body>

<div id="header">
  <a class="brand" href="/">
    <svg width="20" height="20" viewBox="0 0 34 34" xmlns="http://www.w3.org/2000/svg">
      <g fill="#E0B030" stroke="#C8941A" stroke-width="0.4"><ellipse cx="17" cy="5.8" rx="1.9" ry="4.4" transform="rotate(0 17 17)"/><ellipse cx="17" cy="5.8" rx="1.9" ry="4.4" transform="rotate(25.7 17 17)"/><ellipse cx="17" cy="5.8" rx="1.9" ry="4.4" transform="rotate(51.4 17 17)"/><ellipse cx="17" cy="5.8" rx="1.9" ry="4.4" transform="rotate(77.1 17 17)"/><ellipse cx="17" cy="5.8" rx="1.9" ry="4.4" transform="rotate(102.8 17 17)"/><ellipse cx="17" cy="5.8" rx="1.9" ry="4.4" transform="rotate(128.5 17 17)"/><ellipse cx="17" cy="5.8" rx="1.9" ry="4.4" transform="rotate(154.2 17 17)"/><ellipse cx="17" cy="5.8" rx="1.9" ry="4.4" transform="rotate(180 17 17)"/><ellipse cx="17" cy="5.8" rx="1.9" ry="4.4" transform="rotate(205.7 17 17)"/><ellipse cx="17" cy="5.8" rx="1.9" ry="4.4" transform="rotate(231.4 17 17)"/><ellipse cx="17" cy="5.8" rx="1.9" ry="4.4" transform="rotate(257.1 17 17)"/><ellipse cx="17" cy="5.8" rx="1.9" ry="4.4" transform="rotate(282.8 17 17)"/><ellipse cx="17" cy="5.8" rx="1.9" ry="4.4" transform="rotate(308.5 17 17)"/><ellipse cx="17" cy="5.8" rx="1.9" ry="4.4" transform="rotate(334.2 17 17)"/></g>
      <g fill="#F7D44C" stroke="#E0B030" stroke-width="0.3"><ellipse cx="17" cy="10.2" rx="1.3" ry="2.4" transform="rotate(0 17 17)"/><ellipse cx="17" cy="10.2" rx="1.3" ry="2.4" transform="rotate(20 17 17)"/><ellipse cx="17" cy="10.2" rx="1.3" ry="2.4" transform="rotate(60 17 17)"/><ellipse cx="17" cy="10.2" rx="1.3" ry="2.4" transform="rotate(120 17 17)"/><ellipse cx="17" cy="10.2" rx="1.3" ry="2.4" transform="rotate(180 17 17)"/><ellipse cx="17" cy="10.2" rx="1.3" ry="2.4" transform="rotate(240 17 17)"/><ellipse cx="17" cy="10.2" rx="1.3" ry="2.4" transform="rotate(300 17 17)"/></g>
      <circle cx="17" cy="17" r="4.1" fill="#6B5318" stroke="#5A4512" stroke-width="0.3"/>
    </svg>
    marigold
  </a>
</div>

<div id="app-root">
  <div class="loading-state">Loading&hellip;</div>
</div>

<script>
var supabaseClient = window.supabase.createClient(
  'https://palatnljuhrmidpokjtq.supabase.co',
  'sb_publishable_q-3NcTJcFBYo8bmEggiEkA_q5dPwnKR'
);

var root = document.getElementById('app-root');
var currentPlanId = null;
var currentPlanData = null;

function esc(s) {
  return (s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function fmtMoney(n) {
  return '$' + Math.round(n || 0).toLocaleString('en-US');
}

function renderSignIn() {
  root.innerHTML =
    '<div class="center-wrap">' +
      '<div class="dash-title">Sign in</div>' +
      '<div class="dash-sub">Enter the email you used to save your plan.</div>' +
      '<input type="email" id="dash-email-input" class="dash-input" placeholder="you@example.com" autocomplete="email">' +
      '<div id="dash-email-err" class="dash-err"></div>' +
      '<button class="cta" id="dash-send-btn">Send link</button>' +
    '</div>';

  document.getElementById('dash-send-btn').onclick = async function() {
    var btn = this;
    var input = document.getElementById('dash-email-input');
    var err = document.getElementById('dash-email-err');
    var email = (input.value || '').trim();
    if (!email || email.indexOf('@') === -1 || email.indexOf('.') === -1) {
      err.textContent = 'Please enter a valid email.';
      err.style.display = 'block';
      return;
    }
    err.style.display = 'none';
    btn.textContent = 'Sending...'; btn.disabled = true;
    try {
      var redirectTo = window.location.origin + window.location.pathname;
      var result = await supabaseClient.auth.signInWithOtp({ email: email, options: { emailRedirectTo: redirectTo } });
      if (result.error) {
        err.textContent = 'We couldn\'t send that link. Please double-check your email and try again.';
        err.style.display = 'block';
        btn.textContent = 'Send link'; btn.disabled = false;
        return;
      }
      root.innerHTML = '<div class="center-wrap"><div class="dash-title">Check your email</div><div class="dash-sub">We sent a sign-in link to ' + esc(email) + '.</div></div>';
    } catch (e) {
      err.textContent = 'Something went wrong. Please try again.';
      err.style.display = 'block';
      btn.textContent = 'Send link'; btn.disabled = false;
    }
  };
}

// Debounced save, same pattern as the checklist page -- avoids writing to
// Supabase on every keystroke while a couple is actively editing a number.
var _saveTimer = null;
function scheduleBudgetSave() {
  if (_saveTimer) clearTimeout(_saveTimer);
  _saveTimer = setTimeout(async function() {
    if (!currentPlanId) return;
    await supabaseClient.from('plans').update({ plan_data: currentPlanData }).eq('id', currentPlanId);
  }, 600);
}

function renderBudgetPage() {
  var S = currentPlanData.S || {};
  var totalBudget = (S.plan && S.plan.adjustedBudget) || S.budget || 0;
  var allocation = currentPlanData.budgetAllocation || [];

  var totalAllocated = allocation.reduce(function(sum, c) { return sum + (c.allocated_amount || 0); }, 0);
  var totalSpent = allocation.reduce(function(sum, c) { return sum + (c.actual_spent || 0); }, 0);
  var remainder = totalBudget - totalAllocated;

  var remainderClass = remainder < 0 ? 'remainder-over' : (remainder === 0 ? 'remainder-ok' : 'remainder-under');
  var remainderLabel = remainder < 0
    ? ('Over by ' + fmtMoney(Math.abs(remainder)))
    : (remainder === 0 ? 'Fully allocated' : (fmtMoney(remainder) + ' unallocated'));

  var summaryHtml =
    '<div class="budget-summary">' +
      '<div class="budget-summary-total">' + fmtMoney(totalBudget) + ' total budget</div>' +
      '<div class="budget-summary-row"><span>Allocated</span><span>' + fmtMoney(totalAllocated) + '</span></div>' +
      '<div class="budget-summary-row ' + remainderClass + '"><span>' + remainderLabel + '</span><span></span></div>' +
      (totalSpent > 0 ? '<div class="budget-summary-row"><span>Actually spent so far</span><span>' + fmtMoney(totalSpent) + '</span></div>' : '') +
    '</div>';

  var catsHtml = allocation.map(function(cat, i) {
    var pct = totalBudget > 0 ? Math.round((cat.allocated_amount || 0) / totalBudget * 1000) / 10 : 0;
    var badge = cat.shared ? '<span class="budget-cat-badge">Shared</span>'
      : (cat.tradition_specific_to ? '<span class="budget-cat-badge">' + esc(cat.tradition_specific_to) + '</span>' : '');
    var range = (cat.pct_low != null && cat.pct_high != null)
      ? ('Typically ' + cat.pct_low + '&ndash;' + cat.pct_high + '% for this tradition') : '';
    var variance = '';
    if (cat.actual_spent > 0) {
      var diff = cat.actual_spent - cat.allocated_amount;
      if (diff > 0) variance = '<div class="budget-cat-variance over">Over allocated amount by ' + fmtMoney(diff) + '</div>';
      else if (diff < 0) variance = '<div class="budget-cat-variance under">' + fmtMoney(Math.abs(diff)) + ' under allocated amount</div>';
      else variance = '<div class="budget-cat-variance">Exactly on budget</div>';
    }
    return '<div class="budget-cat">' +
      '<div class="budget-cat-header">' +
        '<div class="budget-cat-name">' + esc(cat.category) + badge + '</div>' +
        '<div class="budget-cat-pct">' + pct + '% of total</div>' +
      '</div>' +
      '<div class="budget-cat-fields">' +
        '<div class="budget-field"><label>Allocated</label><div class="budget-field-input-wrap"><input type="number" min="0" step="1" value="' + Math.round(cat.allocated_amount || 0) + '" data-cat-index="' + i + '" data-field="allocated_amount"></div></div>' +
        '<div class="budget-field"><label>Actually spent</label><div class="budget-field-input-wrap"><input type="number" min="0" step="1" value="' + Math.round(cat.actual_spent || 0) + '" data-cat-index="' + i + '" data-field="actual_spent"></div></div>' +
      '</div>' +
      (range ? '<div class="budget-cat-range">' + range + '</div>' : '') +
      variance +
    '</div>';
  }).join('');

  root.innerHTML =
    '<div class="wrap">' +
      '<a class="breadcrumb-back" href="/dashboard">&larr; Back to dashboard</a>' +
      '<div class="dash-title" style="margin-top:12px">Budget</div>' +
      '<div class="dash-sub">Adjust any category to match your real numbers. Percentages update automatically.</div>' +
      summaryHtml +
      (catsHtml || '<div class="loading-state">No budget categories yet -- generate a plan from the questionnaire first.</div>') +
    '</div>';

  document.querySelectorAll('.budget-cat-fields input').forEach(function(input) {
    input.onchange = function() {
      var idx = parseInt(input.getAttribute('data-cat-index'), 10);
      var field = input.getAttribute('data-field');
      var val = parseFloat(input.value);
      if (isNaN(val) || val < 0) val = 0;
      currentPlanData.budgetAllocation[idx][field] = val;
      renderBudgetPage();
      scheduleBudgetSave();
    };
  });
}

async function loadBudget() {
  var sessionResult = await supabaseClient.auth.getSession();
  var session = sessionResult.data.session;
  if (!session) {
    renderSignIn();
    return;
  }
  var result = await supabaseClient.from('plans').select('*').eq('user_id', session.user.id).maybeSingle();
  if (result.error) {
    root.innerHTML = '<div class="center-wrap"><div class="dash-title">Something went wrong</div><div class="dash-sub">We couldn\u2019t load your budget. Please try refreshing the page.</div></div>';
    return;
  }
  if (!result.data) {
    root.innerHTML = '<div class="center-wrap"><div class="dash-title">No saved plan yet</div><div class="dash-sub">Once you save a plan from the questionnaire, your budget will show up here.</div><a href="/questionnaire" class="cta" style="display:inline-block;text-decoration:none;margin-top:8px">Start your plan &rarr;</a></div>';
    return;
  }
  currentPlanId = result.data.id;
  currentPlanData = result.data.plan_data || {};
  renderBudgetPage();
}

supabaseClient.auth.onAuthStateChange(function(event, session) {
  if (event === 'SIGNED_IN') { loadBudget(); }
});

window.onload = loadBudget;
</script>

</body>
</html>
